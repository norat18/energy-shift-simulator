    <script type="text/babel">
        const { useState, useEffect } = React;

                profiles: {

                }
            }
        };
        Object.values(SEGMENTS).forEach((s) => {
            s.basePeak = sum(Object.values(s.loads).map((l) => l.kw));
        });

        // PSE Flex programs for business customers, from PSE's public program pages and terms (checked Oct 2026).
        // basis: how the incentive is paid. Seasons: winter (Nov 1 – Mar 31) and summer (May 1 – Sep 30).
        const PROGRAMS = {
            flexci: {
                name: 'Flex C&I',
                type: 'Capacity + performance',
                basis: 'kw-season',
                rate: 65, // $/kW per season, PSE's advertised maximum
                rateLabel: 'Up to $65/kW per season',
                schedules: ['7A', '24', '25', '26', '31', '35', '49'],
                notice: 'Text, email, or call before dispatch',
                shortfallTerms: 'No published penalty. Earnings combine your committed kW with your average performance across the season, so a shortfall lowers your payment.',
                desc: 'PSE\'s program for larger businesses, delivered with Enel: a custom energy-reduction plan, manual or automated response, and 24/7 dispatch support at no cost to enroll. Includes Peak and Emergency events; only Peak events are modeled here, since Emergency terms aren\'t published.'
            },
            flexbusiness: {
                name: 'Flex Business',
                type: 'Opt-in, behavioral',
                basis: 'kwh',
                rate: 1, // $/kWh saved
                rateLabel: '$1/kWh saved',
                schedules: ['24', '25'],
                notice: 'Email or text, at least 5 hours ahead',
                shortfallTerms: 'No penalty. You can decline any event and are paid for the kWh you save, plus a $50 one-time enrollment payment.',
                desc: 'For small and medium businesses. PSE notifies you of an event and you cut use any way you choose.'
            },
            flexsmart: {
                name: 'Flex Smart (business thermostats)',
                type: 'Automated thermostat',
                basis: 'kw-season-hvac',
                rate: 35, // $/kW of average reduction per season
                rateLabel: '$35/kW per season',
                schedules: ['24', '25'],
                notice: 'Up to 2 hours, on the thermostat',
                shortfallTerms: 'No penalty. Overrides are allowed but lower your average kW. Also $50 per smart thermostat to enroll and $20 per thermostat each season.',
                desc: 'PSE adjusts enrolled thermostats up to 4°F, with up to 1 hour of pre-conditioning. Paid on the average kW your HVAC reduces across the season\'s events.'
            }
        };
        const SEASONS_PER_YEAR = 2;
        // PSE called 7 events in its first Flex winter (2023–24). Flex Business and Flex Smart terms cap events at 15 per season.
        const EVENTS = { low: 6, expected: 12, high: 30 };

        // PSE Schedule 26 (Large Demand General Service), effective 3/21/2026, via the OpenEI rate database.
        // The higher demand rate applies in the winter months (Oct – Mar).
        const TARIFF = { winterDemand: 18.88, summerDemand: 11.67, energy: 0.12 };
        const scheduleFor = (peakKW) => (peakKW <= 50 ? '24' : peakKW <= 350 ? '25' : '26');

        // Peak windows from PSE's 2026 Demand Response RFP (Appendix B).
        const EVENT_WINDOWS = {
            winterAM: { label: '❄️ Winter AM', start: 7, season: 'winter', note: 'PSE\'s winter peak (Dec–Feb) typically falls 7–10 AM and/or 5–10 PM on days below 30°F, and lasts 4–6 hours.' },
            winterPM: { label: '❄️ Winter PM', start: 17, season: 'winter', note: 'PSE\'s winter peak (Dec–Feb) typically falls 7–10 AM and/or 5–10 PM on days below 30°F, and lasts 4–6 hours.' },
            summer: { label: '☀️ Summer PM', start: 15, season: 'summer', note: 'PSE\'s smaller summer peak (Jul–Aug) typically falls 3–9 PM on days above 85°F, and lasts 3–4 hours.' }
        };

        // From PSE's 2026 DR RFP (Appendix B and section 1.2): [year, winter peak MW, summer peak MW].
        const PEAK_HISTORY = [
            [2019, 4498, 3196], [2020, 4245, 3418], [2021, 4741, 4036], [2022, 4807, 3819],
            [2023, 4329, 3853], [2024, 4957, 3832], [2025, 4629, 3756]
        ];
        const DR_CURRENT_MW = 129;
        const DR_NEED_2030_MW = 500;

        const SOURCES = [
            ['PSE Flex C&I program page', 'https://www.pse.com/en/business-incentives/energy-management-programs/flex-c-i'],
            ['PSE Flex for Business options', 'https://www.pse.com/en/business-incentives/energy-management-programs/flex-for-business'],
            ['PSE Demand Response terms and conditions', 'https://www.pse.com/en/rebates/PSE-flex/PSE-Demand-Response-terms-and-conditions'],
            ['PSE 2026 Demand Response RFP', 'https://www.pse.com/en/pages/energy-supply/acquiring-energy/2026-Demand-Response-Request-for-Proposals'],
            ['Schedule 26 rates (OpenEI)', 'https://apps.openei.org/USURDB/rate/view/69ef9df37b85aa692d050dba'],
            ['CETA: coal phase-out, RCW 19.405.030', 'https://app.leg.wa.gov/rcw/default.aspx?cite=19.405.030'],
            ['CETA: 2030 standard, RCW 19.405.040', 'https://app.leg.wa.gov/rcw/default.aspx?cite=19.405.040']
        ];

        // Shares of the shifted energy that come back before (pre) and after (post) the event, by hour.
        const RECOVERY = {
            uncontrolled: { label: 'Uncontrolled restart', pre: [], post: [0.45, 0.25], desc: 'Everything comes back on when the event ends. The snapback can set a new peak.' },
            precondition: { label: 'Pre-condition + ramp', pre: [0.15, 0.2], post: [0.15, 0.1], desc: 'Pre-heat or pre-cool and bank production before the event, then ramp loads back gradually.' },
            staggered: { label: 'Staggered restart', pre: [], post: [], fill: { share: 0.65, hours: 8 }, desc: 'Controls bring loads back in waves, filling the lowest-load hours over the next eight hours (e.g. managed overnight charging).' }
        };

        // Prior 10 non-event weekdays, relative to the event day. Event days are the coldest or hottest days.
        const PRIOR_DAYS = [0.96, 0.89, 0.98, 0.87, 0.94, 0.92, 0.90, 0.97, 0.88, 0.95];

        // Illustrative marginal emission factors (t CO2 / MWh).
        const PEAK_EF = 0.55;
        const OFFPEAK_EF = 0.40;

        const CHECKLIST = [
            { id: 'meter', label: '15-minute interval meter (AMI) on the account', why: 'Needed to measure performance against your baseline.' },
            { id: 'controls', label: 'BMS or load controls on curtailable equipment', why: 'Lets you shed load reliably on short notice.' },
            { id: 'openadr', label: 'Event notifications set up (text, email, phone) or an automated signal connection', why: 'PSE notifies you before dispatch; automation (e.g. OpenADR) responds without staff.' },
            { id: 'contact', label: 'Named event contact and backup', why: 'Someone to confirm, monitor, and override if needed.' },
            { id: 'plan', label: 'Written curtailment plan for each load', why: 'Spells out what turns down, by how much, and in what order.' },
            { id: 'override', label: 'Override procedure for critical operations', why: 'Protects safety, product, and people if conditions change.' },
            { id: 'test', label: 'Test event scheduled before the season', why: 'Confirms the kW you can safely commit.' }
        ];

        const buildDay = ({ profile, peakDemand, curtailableKW, shiftShare, pf, start, dur, recovery, drOn }) => {
            const baseline = profile.map((p) => p * peakDemand);
            const dr = baseline.slice();
            const kind = Array(24).fill('normal');
            const isEvent = (h) => mod24(h - start) < dur;
            let eventKWh = 0;
            if (drOn) {
                for (let h = 0; h < 24; h++) {
                    if (isEvent(h)) {
                        const r = curtailableKW * pf * profile[h];
                        dr[h] -= r;
                        eventKWh += r;
                        kind[h] = 'event';
                    }
                }
            }
            const shiftedKWh = eventKWh * shiftShare;
            let addedKWh = 0;
            if (drOn && shiftedKWh > 0) {
                recovery.pre.forEach((f, i) => {
                    const h = mod24(start - recovery.pre.length + i);
                    dr[h] += shiftedKWh * f;
                    addedKWh += shiftedKWh * f;
                    kind[h] = 'pre';
                });
                recovery.post.forEach((f, i) => {
                    const h = mod24(start + dur + i);
                    dr[h] += shiftedKWh * f;
                    addedKWh += shiftedKWh * f;
                    kind[h] = 'rebound';
                });
                if (recovery.fill) {
                    // Valley-fill: return energy into the hours with the most headroom below 95% of the normal peak.
                    const cap = Math.max(...baseline) * 0.95;
                    const fillHours = Array.from({ length: recovery.fill.hours }, (_, i) => mod24(start + dur + i));
                    const headroom = fillHours.map((h) => Math.max(0, cap - dr[h]));
                    const totalHeadroom = sum(headroom);
                    const energy = shiftedKWh * recovery.fill.share;
                    const inHeadroom = Math.min(energy, totalHeadroom);
                    const overflow = energy - inHeadroom;
                    fillHours.forEach((h, i) => {
                        const add = (totalHeadroom > 0 ? inHeadroom * headroom[i] / totalHeadroom : 0) + overflow / fillHours.length;
                        if (add > 0.5) {
                            dr[h] += add;
                            kind[h] = 'rebound';
                        }
                        addedKWh += add;
                    });
                }
            }
            const argmax = (a) => a.reduce((best, v, i) => (v > a[best] + 1e-9 ? i : best), 0);
            const baseMaxHour = argmax(baseline);
            const drMaxHour = argmax(dr);
            return {
                baseline, dr, kind, isEvent, eventKWh, addedKWh,
                perfKW: drOn ? eventKWh / dur : 0,
                baseMax: baseline[baseMaxHour], baseMaxHour,
                drMax: dr[drMaxHour], drMaxHour
            };
        };

        const initFacility = () => Object.fromEntries(
            Object.entries(SEGMENTS).map(([k, s]) => [k, JSON.parse(JSON.stringify(s.loads))])
        );

        // ---------- Small components ----------
        const TabButton = ({ active, label, onClick }) => (
            <button

        const Segmented = ({ options, value, onChange }) => (

        const Slider = ({ label, display, value, min, max, step = 1, onChange, hint }) => (

                {hint && <div style={{ fontSize: '11px', color: C.muted, marginTop: '6px', lineHeight: 1.4 }}>{hint}</div>}
            </div>

        const NumberField = ({ label, value, onChange, prefix, hint }) => (
            <div>
                <div style={{ fontSize: '13px', color: C.sub, marginBottom: '8px' }}>{label}</div>

                {hint && <div style={{ fontSize: '11px', color: C.muted, marginTop: '6px', lineHeight: 1.4 }}>{hint}</div>}

        // What the simulator knows, what it assumes, and what nobody can know before enrollment.
        const ASSUMPTIONS = {
            confirmed: [
                'Flex C&I pays up to $65/kW per season (up to $130/kW a year), with no-cost enrollment support from PSE and Enel',
                'Flex Business ($1/kWh, $50 to enroll) and Flex Smart ($35/kW per season) are for Schedules 24 and 25 only',
                'Flex events: Nov 1 – Mar 31 and May 1 – Sep 30, 7 AM – 10 PM, 4 hours or less',
                'No financial penalties appear in PSE\'s published terms',
                'PSE\'s winter and summer peaks for 2019–2025, peak hours, and 2030 demand response need (2026 DR RFP)',
                'CETA milestones (RCW 19.405)'
            ],
            modeled: [
                ['Flex C&I pay = lower of committed kW and average performance, × rate × 2 seasons', 'PSE says pay "combines" both but doesn\'t publish the formula.'],
                ['6 / 12 / 30 events a year in the scenarios', 'PSE called 7 events in its first winter; Flex Business caps events at 15 per season.'],
                ['Schedule 26 demand rates ($18.88 winter, $11.67 summer) for every segment', 'Taken from OpenEI\'s copy of the tariff; winter months (Oct – Mar) from a third-party guide. Sites on Schedules 24 or 25 pay different rates.'],
                ['Energy at about $0.12/kWh', 'Schedule 26 energy charge plus adjustments, rounded.'],
                ['Same performance in winter and summer', 'The simulator models one event window at a time.'],
                ['Load shapes, segment bills, and sheddable shares', 'Typical values for each building type; edit them in "Model your facility".'],
                ['Controls cost, 10%/yr maintenance, and emissions factors', 'Placeholders. Replace with a contractor quote and hourly emissions data.']
            ],
            unknown: [
                'Your actual Flex C&I rate, and how PSE weights committed kW against performance',
                'Flex C&I event caps, maximum event length, and notice time',
                'Emergency event terms (only Peak events are modeled)',
                'The baseline and adjustment method PSE uses to settle your events',
                'Whether PSE installs metering or controls at your site'
            ]
        };

        const AssumedTag = ({ note }) => (
            <a
                href="#assumptions"
                title={note ? `Assumed: ${note}` : 'Assumed value. See "What\'s sourced vs. assumed".'}
                onClick={(e) => e.stopPropagation()}
                style={{
                    display: 'inline-block', marginLeft: '6px', padding: '1px 7px', borderRadius: '6px',
                    fontSize: '10px', fontWeight: '600', letterSpacing: '0.3px', verticalAlign: 'middle',
                    color: C.amber, background: 'rgba(251, 191, 36, 0.15)', border: '1px solid rgba(251, 191, 36, 0.35)',
                    textDecoration: 'none', cursor: 'help', textTransform: 'uppercase'
                }}
            >
                assumed
            </a>
        );

        const SectionHeader = ({ title, desc }) => (
            <div style={{ marginBottom: '24px' }}>
                <h2 style={{ fontSize: '20px', fontWeight: '600', margin: '0 0 8px 0', color: '#fff' }}>{title}</h2>
                {desc && <p style={{ fontSize: '14px', color: C.muted, margin: 0, lineHeight: 1.5 }}>{desc}</p>}
            </div>
        );

        const MetricCard = ({ label, value, sub, color }) => (
            <div style={{
                padding: '20px',
                borderRadius: '16px',
                background: `linear-gradient(135deg, ${color}1a 0%, ${color}0d 100%)`,
                border: `1px solid ${color}33`
            }}>
                <div style={{ fontSize: '12px', color, fontWeight: '600', marginBottom: '8px', letterSpacing: '0.3px' }}>{label}</div>
                <div style={{ fontSize: '28px', fontWeight: '700', color: '#fff' }}>{value}</div>
                {sub && <div style={{ fontSize: '12px', color: C.muted, marginTop: '4px' }}>{sub}</div>}
            </div>
        );

        const Stat = ({ value, label, color }) => (
            <div style={{ textAlign: 'center' }}>
                <div style={{ fontSize: '26px', fontWeight: '700', color }}>{value}</div>
                <div style={{ fontSize: '12px', color: C.muted }}>{label}</div>
            </div>
        );

        const SummaryRow = ({ label, value, color, strong }) => (
            <div style={{ display: 'flex', justifyContent: 'space-between', gap: '12px', padding: strong ? '16px 0 4px' : '12px 0', borderBottom: strong ? 'none' : '1px solid rgba(255,255,255,0.08)' }}>
                <span style={{ color: strong ? '#fff' : C.sub, fontWeight: strong ? '600' : '400', fontSize: strong ? '16px' : '14px' }}>{label}</span>
                <span style={{ color, fontWeight: strong ? '700' : '600', fontSize: strong ? '20px' : '14px' }}>{value}</span>
            </div>
        );

        // ---------- App ----------
        const CIDemandResponseSimulator = () => {
            const [activeTab, setActiveTab] = useState('profile');
            const [segKey, setSegKey] = useState('commercial');
            const [facility, setFacility] = useState(initFacility);
            const [programKey, setProgramKey] = useState('flexci');
            const [drEnabled, setDrEnabled] = useState(true);
            const [windowKey, setWindowKey] = useState('winterAM');
            const [eventDuration, setEventDuration] = useState(3);
            const [recoveryKey, setRecoveryKey] = useState('precondition');
            const [performance, setPerformance] = useState(0.85);
            const [currentHour, setCurrentHour] = useState(7);
            const [isAnimating, setIsAnimating] = useState(false);
            const [commitPct, setCommitPct] = useState(0.75);
            const [peakAligned, setPeakAligned] = useState(3);
            const [costOverrides, setCostOverrides] = useState({});
            const [rebatePerKW, setRebatePerKW] = useState(0);
            const [discountRate, setDiscountRate] = useState(0.08);
            const [enrollPath, setEnrollPath] = useState('manual');
            const [flexCIRate, setFlexCIRate] = useState(PROGRAMS.flexci.rate);
            const [checklist, setChecklist] = useState({});
            const [sitesEnrolled, setSitesEnrolled] = useState(100);
            const [ctaClicked, setCtaClicked] = useState(false);

            const seg = SEGMENTS[segKey];
            const loads = facility[segKey];
            const loadList = Object.entries(loads);
            const program = PROGRAMS[programKey];
            const win = EVENT_WINDOWS[windowKey];
            const start = win.start;
            const season = win.season;
            const profile = seg.profiles[season];
            const recovery = RECOVERY[recoveryKey];
            const controlsCostPerKW = costOverrides[segKey] ?? seg.controlsCost;

            const peakDemand = sum(loadList.map(([, l]) => l.kw));
            const curtailableKW = sum(loadList.map(([, l]) => l.kw * l.pct / 100));
            const shiftableKW = sum(loadList.filter(([, l]) => l.shift).map(([, l]) => l.kw * l.pct / 100));
            const shiftShare = curtailableKW > 0 ? shiftableKW / curtailableKW : 0;
            const firmKW = peakDemand - curtailableKW;
            const hvacKW = loads.hvac ? loads.hvac.kw * loads.hvac.pct / 100 : 0;
            const hvacShare = curtailableKW > 0 ? hvacKW / curtailableKW : 0;
            const annualBill = seg.avgMonthlyBill * (peakDemand / seg.basePeak) * 12;
            const schedule = scheduleFor(peakDemand);
            const isEligible = (pk) => PROGRAMS[pk].schedules.includes(schedule);
            const demandRate = season === 'winter' ? TARIFF.winterDemand : TARIFF.summerDemand;
            const rateFor = (pk) => (pk === 'flexci' ? flexCIRate : PROGRAMS[pk].rate);

            const eventHours = Array.from({ length: eventDuration }, (_, i) => mod24(start + i));
            // What the curtailable loads can actually shed in this window, since they aren't at full load every hour.
            const eventPotentialKW = curtailableKW * sum(eventHours.map((h) => profile[h])) / eventDuration;
            const committedKW = eventPotentialKW * commitPct;

            const dayArgs = { profile, peakDemand, curtailableKW, shiftShare, start, dur: eventDuration, recovery };
            const day = buildDay({ ...dayArgs, pf: performance, drOn: drEnabled });

            const computeCase = (pk, pf, aligned, events) => {
                const prog = PROGRAMS[pk];
                const d = buildDay({ ...dayArgs, pf, drOn: true });
                const rate = rateFor(pk);
                const shortfallKW = pk === 'flexci' ? Math.max(0, committedKW - d.perfKW) : 0;
                let incentive = 0;
                if (prog.basis === 'kw-season') {
                    // Modeled as committed kW, capped by average performance, times the seasonal rate.
                    incentive = Math.min(d.perfKW, committedKW) * rate * SEASONS_PER_YEAR;
                } else if (prog.basis === 'kw-season-hvac') {
                    incentive = d.perfKW * hvacShare * rate * SEASONS_PER_YEAR;
                } else {
                    incentive = d.eventKWh * events * rate;
                }
                const shortfallLoss = shortfallKW * rate * SEASONS_PER_YEAR;
                const peakReductionKW = d.baseMax - d.drMax;
                const demandSavings = peakReductionKW * demandRate * aligned;
                const energySavings = (d.eventKWh - d.addedKWh) * events * TARIFF.energy;
                const grossControls = curtailableKW * controlsCostPerKW;
                const automated = enrollPath === 'automated';
                const upfront = automated ? Math.max(0, grossControls - curtailableKW * rebatePerKW) : 0;
                const maintenance = automated ? grossControls * 0.1 : 0;
                const annualNet = incentive + demandSavings + energySavings - maintenance;
                let npv = -upfront;
                for (let t = 1; t <= 10; t++) npv += annualNet / Math.pow(1 + discountRate, t);
                const paybackMonths = upfront === 0 ? 0 : annualNet > 0 ? (upfront / annualNet) * 12 : null;
                return {
                    d, pf, aligned, events, rate, shortfallKW, shortfallLoss, incentive,
                    peakReductionKW, demandSavings, energySavings, upfront, maintenance, annualNet, npv, paybackMonths
                };
            };

            const expected = computeCase(programKey, performance, peakAligned, EVENTS.expected);
            const scenarios = [
                { key: 'worst', label: 'Downside', color: C.red, c: computeCase(programKey, Math.max(0.3, performance - 0.15), Math.max(0, peakAligned - 2), EVENTS.low) },
                { key: 'expected', label: 'Expected', color: C.blue, c: expected },
                { key: 'best', label: 'Upside', color: C.green, c: computeCase(programKey, Math.min(1, performance + 0.1), Math.min(12, peakAligned + 2), EVENTS.high) }
            ];

            const formatPayback = (m) => (m === null ? 'Never' : m === 0 ? 'Immediate' : `${Math.round(m)} mo`);

            useEffect(() => {
                if (isAnimating) {
                    const interval = setInterval(() => {
                        setCurrentHour((prev) => (prev + 1) % 24);
                    }, 800);
                    return () => clearInterval(interval);
                }
            }, [isAnimating]);

            useEffect(() => {
                setCurrentHour(start);
            }, [windowKey]);

            const setLoad = (key, field, value) => {
                setFacility((f) => ({
                    ...f,
                    [segKey]: { ...f[segKey], [key]: { ...f[segKey][key], [field]: value } }
                }));
            };
            const resetFacility = () => {
                setFacility((f) => ({ ...f, [segKey]: JSON.parse(JSON.stringify(SEGMENTS[segKey].loads)) }));
            };

            const hours = Array.from({ length: 24 }, (_, i) => i);

            // ---------- Settlement (baseline) ----------
            const settlement = (() => {
                const d = expected.d;
                const avgF = sum(PRIOR_DAYS) / PRIOR_DAYS.length;
                // Adjustment window: two hours, ending before any pre-conditioning starts.
                const adjHours = [mod24(start - 4), mod24(start - 3)];
                const windowActual = sum(adjHours.map((h) => d.dr[h]));
                const windowAvg = sum(adjHours.map((h) => d.baseline[h] * avgF));
                const rawFactor = windowActual / windowAvg;
                const factor = Math.min(1.2, Math.max(0.8, rawFactor));
                const rows = eventHours.map((h) => {
                    const avg = d.baseline[h] * avgF;
                    const adj = avg * factor;
                    const measured = d.dr[h];
                    return { h, avg, adj, measured, red: adj - measured, redUnadj: avg - measured };
                });
                const perf = sum(rows.map((r) => r.red)) / rows.length;
                const perfUnadj = sum(rows.map((r) => r.redUnadj)) / rows.length;
                const kWh = sum(rows.map((r) => Math.max(0, r.red)));
                const priorDays = PRIOR_DAYS.map((f) => sum(eventHours.map((h) => d.baseline[h] * f)) / eventDuration);
                const eventDayLoad = sum(eventHours.map((h) => d.baseline[h])) / eventDuration;
                return { adjHours, factor, rows, perf, perfUnadj, kWh, priorDays, eventDayLoad };
            })();

            // ---------- Grid & carbon ----------
            const annualEventMWh = (expected.d.eventKWh * expected.events) / 1000;
            const annualAddedMWh = (expected.d.addedKWh * expected.events) / 1000;
            const tonsAvoided = annualEventMWh * PEAK_EF - annualAddedMWh * OFFPEAK_EF;
            const portfolioMW = (expected.d.perfKW * sitesEnrolled) / 1000;

            const readiness = Math.round((CHECKLIST.filter((c) => checklist[c.id]).length / CHECKLIST.length) * 100);

            const getImpacts = () => {
                const cond = season === 'winter' ? 'Pre-heat' : 'Pre-cool';
                const drift = season === 'winter' ? 'drops' : 'rises';
                const impacts = {
                    smb: [
                        { load: 'HVAC', impact: `Temperature ${drift} 2-4°F`, severity: 'low', mitigation: `${cond} before event` },
                        { load: 'Lighting', impact: 'Dim to 50% in non-critical areas', severity: 'low', mitigation: 'Maintain task lighting' }
                    ],
                    commercial: [
                        { load: 'HVAC/Heat Pumps/Chiller', impact: `Temperature ${drift} 3-5°F`, severity: 'medium', mitigation: `${cond} building, notify occupants` },
                        { load: 'Lighting', impact: 'Reduce to 70% in common areas', severity: 'low', mitigation: 'Maintain office lighting' },
                        { load: 'Misc. Loads', impact: 'Non-essential equipment off', severity: 'low', mitigation: 'Schedule around events' }
                    ],
                    industrial: [
                        { load: 'Process Equipment', impact: 'Reduce production rate 20-30%', severity: 'medium', mitigation: 'Shift production to off-peak' },
                        { load: 'HVAC', impact: `Warehouse temperature ${drift}`, severity: 'low', mitigation: `${cond}, ventilation only` },
                        { load: 'Compressors', impact: 'Cycle compressors', severity: 'medium', mitigation: 'Build pressure before event' }
                    ],
                    largeLoad: [
                        { load: 'Cooling Systems', impact: 'Raise setpoint 2-3°F', severity: 'medium', mitigation: 'Pre-cool, monitor thermal limits' },
                        { load: 'Auxiliary Systems', impact: 'Reduce non-critical load', severity: 'low', mitigation: 'Automated load shedding' },
                        { load: 'Facility Lighting', impact: 'Dim to 60%', severity: 'low', mitigation: 'Emergency lighting maintained' }
                    ],
                    fleet: [
                        { load: 'EV Fleet Chargers', impact: 'Pause or throttle charging', severity: 'medium', mitigation: 'Charge to target before event; prioritize vehicles by departure time' },
                        { load: 'Depot HVAC', impact: `Temperature ${drift} 2-4°F`, severity: 'low', mitigation: `${cond} before event` },
                        { load: 'Maintenance Shop', impact: 'Defer lifts, compressors, and welding', severity: 'low', mitigation: 'Schedule heavy work outside event hours' }
                    ]
                };
                return [
                    ...impacts[segKey],
                    {
                        load: 'Restart after event',
                        impact: recovery.desc,
                        severity: recoveryKey === 'uncontrolled' ? 'medium' : 'low',
                        mitigation: recoveryKey === 'uncontrolled' ? 'Switch to a staggered restart to avoid a new peak' : 'Sequencing set up in controls'
                    }
                ];
            };

            const SegmentCard = ({ id, segment }) => {
                const selected = segKey === id;
                const segPeak = sum(Object.values(facility[id]).map((l) => l.kw));
                const segBill = segment.avgMonthlyBill * segPeak / segment.basePeak;
                return (
                    <div
                        onClick={() => setSegKey(id)}
                        style={{
                            padding: '18px',
                            borderRadius: '16px',
                            border: `2px solid ${selected ? C.green : 'rgba(255,255,255,0.08)'}`,
                            background: selected ? 'rgba(74, 222, 128, 0.08)' : 'rgba(255,255,255,0.02)',
                            cursor: 'pointer',
                            transition: 'all 0.2s ease'
                        }}
                    >
                        <div style={{ display: 'flex', alignItems: 'center', gap: '12px', marginBottom: '8px' }}>
                            <span style={{ fontSize: '28px' }}>{segment.icon}</span>
                            <div>
                                <div style={{ fontSize: '15px', fontWeight: '600', color: '#fff' }}>{segment.name}</div>
                                <div style={{ fontSize: '12px', color: C.muted }}>{segment.examples}</div>
                            </div>
                        </div>
                        <div style={{ display: 'flex', gap: '16px', marginTop: '12px', fontSize: '12px' }}>
                            <div>
                                <div style={{ color: C.muted }}>Peak Demand</div>
                                <div style={{ color: C.blue, fontWeight: '600' }}>{num(segPeak)} kW</div>
                            </div>
                            <div>
                                <div style={{ color: C.muted }}>Avg. Bill<AssumedTag note="Typical bill for this building type, not a PSE figure." /></div>
                                <div style={{ color: C.green, fontWeight: '600' }}>${(segBill / 1000).toFixed(segBill < 10000 ? 1 : 0)}k/mo</div>
                            </div>
                        </div>
                    </div>
                );
            };

            // ---------- Chart ----------
            const chartMax = Math.max(day.baseMax, day.drMax) * 1.1;
            const barColor = (h) => {
                if (h === currentHour) return 'linear-gradient(180deg, #fbbf24, #f59e0b)';
                if (!drEnabled) return day.isEvent(h) ? 'linear-gradient(180deg, #f87171, #ef4444)' : 'linear-gradient(180deg, rgba(56, 189, 248, 0.6), rgba(56, 189, 248, 0.3))';
                switch (day.kind[h]) {
                    case 'event': return 'linear-gradient(180deg, #4ade80, #22c55e)';
                    case 'pre': return 'linear-gradient(180deg, #fdba74, #fb923c)';
                    case 'rebound': return 'linear-gradient(180deg, #d8b4fe, #c084fc)';
                    default: return 'linear-gradient(180deg, rgba(56, 189, 248, 0.6), rgba(56, 189, 248, 0.3))';
                }
            };
            const shownAt = (h) => (drEnabled ? day.dr[h] : day.baseline[h]);
            const peakInsight = (() => {
                if (!drEnabled) return null;
                const reduction = day.baseMax - day.drMax;
                if (day.drMax > day.baseMax + 0.5) {
                    return { color: C.red, text: `⚠️ The rebound at ${formatHour(day.drMaxHour)} sets a new peak of ${num(day.drMax)} kW, ${num(day.drMax - day.baseMax)} kW above your normal peak. That raises this month's demand charge. ${recoveryKey === 'staggered' ? 'Shed less load or shorten the event so the returning energy fits off-peak.' : 'Try a staggered restart.'}` };
                }
                if (reduction < 1) {
                    return { color: C.amber, text: `Your facility peaks at ${formatHour(day.baseMaxHour)}, outside the ${formatWindow(start, eventDuration)} event. You still earn DR incentives, but this event won't lower your demand charge.` };
                }
                return { color: C.green, text: `✓ On event days, your billing peak drops from ${num(day.baseMax)} kW to ${num(day.drMax)} kW (−${num(reduction)} kW). It now falls at ${formatHour(day.drMaxHour)}.` };
            })();

            const tabs = [
                ['profile', '📊 Load Profile'],
                ['programs', '💰 DR Programs'],
                ['settlement', '🧾 Baseline & Pay'],
                ['business', '📈 Business Case'],
                ['operations', '⚙️ Operations'],
                ['grid', '🌎 Grid & Carbon'],
                ['next', '✅ Next Steps']
            ];

            return (
                <div style={{
                    minHeight: '100vh',
                    background: 'linear-gradient(165deg, #0a1628 0%, #1a2d4a 50%, #0d2137 100%)',
                    fontFamily: "'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif",
                    color: '#e8f0f7',
                    padding: '40px 16px',
                    position: 'relative',
                    overflow: 'hidden'
                }}>
                    <div style={{
                        position: 'absolute', top: '10%', right: '5%', width: '400px', height: '400px',
                        background: 'radial-gradient(circle, rgba(74, 222, 128, 0.08) 0%, transparent 70%)',
                        borderRadius: '50%', pointerEvents: 'none'
                    }} />
                    <div style={{
                        position: 'absolute', bottom: '20%', left: '10%', width: '300px', height: '300px',
                        background: 'radial-gradient(circle, rgba(56, 189, 248, 0.06) 0%, transparent 70%)',
                        borderRadius: '50%', pointerEvents: 'none'
                    }} />

                    <div style={{ maxWidth: '1200px', margin: '0 auto', position: 'relative' }}>
                        <header style={{ marginBottom: '36px', textAlign: 'center' }}>
                            <div style={{
                                display: 'inline-flex', alignItems: 'center', gap: '12px', marginBottom: '16px',
                                padding: '8px 16px', background: 'rgba(74, 222, 128, 0.1)', borderRadius: '24px',
                                border: '1px solid rgba(74, 222, 128, 0.2)'
                            }}>
                                <div style={{ width: '10px', height: '10px', borderRadius: '50%', background: C.green, boxShadow: '0 0 12px rgba(74, 222, 128, 0.6)' }} />
                                <span style={{ fontSize: '13px', fontWeight: '500', letterSpacing: '0.5px', color: C.green }}>
                                    C&I DEMAND RESPONSE SIMULATOR
                                </span>
                            </div>
                            <h1 style={{
                                fontSize: 'clamp(28px, 5vw, 44px)', fontWeight: '700', margin: '0 0 12px 0',
                                background: 'linear-gradient(135deg, #ffffff 0%, #94cff7 100%)',
                                WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent', letterSpacing: '-1px'
                            }}>
                                Reduce peak demand. Earn incentives.
                            </h1>
                            <p style={{ fontSize: '17px', color: C.sub, maxWidth: '650px', margin: '0 auto', lineHeight: '1.6' }}>
                                Explore how demand response helps commercial and industrial customers cut costs, earn revenue, and support grid reliability.
                            </p>
                        </header>

                        {/* Segment selector */}
                        <div style={{ ...autoGrid(200), gap: '12px', marginBottom: '24px' }}>
                            {Object.entries(SEGMENTS).map(([id, segment]) => (
                                <SegmentCard key={id} id={id} segment={segment} />
                            ))}
                        </div>

                        {/* Event settings: shared by every tab */}
                        <div style={{ ...panel, padding: '24px' }}>
                            <div style={{ ...autoGrid(250), gap: '24px' }}>
                                <div>
                                    <div style={{ fontSize: '13px', color: C.sub, marginBottom: '8px' }}>Event window</div>
                                    <Segmented
                                        value={windowKey}
                                        onChange={setWindowKey}
                                        options={Object.entries(EVENT_WINDOWS).map(([k, w]) => ({ value: k, label: w.label }))}
                                    />
                                    <div style={{ fontSize: '11px', color: C.muted, marginTop: '6px', lineHeight: 1.4 }}>{win.note}</div>
                                </div>
                                <Slider
                                    label="Event duration"
                                    display={`${eventDuration} hr · ${formatWindow(start, eventDuration)}`}
                                    value={eventDuration} min={1} max={4}
                                    onChange={setEventDuration}
                                    hint="PSE Flex events run 4 hours or less, 7 AM – 10 PM on non-holidays."
                                />
                                <Slider
                                    label="Delivered performance"
                                    display={`${Math.round(performance * 100)}%`}
                                    value={performance} min={0.3} max={1} step={0.05}
                                    onChange={setPerformance}
                                    hint="Share of curtailable load you actually shed. Drives the chart, payments, and penalties."
                                />
                                <div>
                                    <div style={{ fontSize: '13px', color: C.sub, marginBottom: '8px' }}>Recovery strategy</div>
                                    <Segmented
                                        value={recoveryKey}
                                        onChange={setRecoveryKey}
                                        options={Object.entries(RECOVERY).map(([k, r]) => ({ value: k, label: r.label }))}
                                    />
                                    <div style={{ fontSize: '11px', color: C.muted, marginTop: '6px', lineHeight: 1.4 }}>{recovery.desc}</div>
                                </div>
                            </div>
                        </div>

                        <div style={{
                            display: 'flex', gap: '8px', overflowX: 'auto', padding: '4px',
                            background: 'rgba(0,0,0,0.2)', borderRadius: '14px', width: 'fit-content', maxWidth: '100%',
                            margin: '0 auto 24px auto'
                        }}>
                            {tabs.map(([id, label]) => (
                                <TabButton key={id} active={activeTab === id} label={label} onClick={() => setActiveTab(id)} />
                            ))}
                        </div>

                        {activeTab === 'profile' && (
                            <>
                                <div style={panel}>
                                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '28px', flexWrap: 'wrap', gap: '16px' }}>
                                        <div style={{ display: 'flex', alignItems: 'center', gap: '16px' }}>
                                            <span style={{ fontSize: '15px', color: C.sub }}>Demand Response</span>
                                            <button
                                                onClick={() => setDrEnabled(!drEnabled)}
                                                style={{
                                                    width: '56px', height: '30px', borderRadius: '15px', border: 'none',
                                                    background: drEnabled ? 'linear-gradient(135deg, #4ade80, #22c55e)' : 'rgba(255,255,255,0.15)',
                                                    cursor: 'pointer', position: 'relative', transition: 'all 0.3s ease',
                                                    boxShadow: drEnabled ? '0 0 20px rgba(74, 222, 128, 0.3)' : 'none'
                                                }}

                                    <ul style={{ paddingLeft: '18px', fontSize: '13px', color: C.sub, lineHeight: 1.6, display: 'grid', gap: '6px' }}>
                                        {ASSUMPTIONS.confirmed.map((t) => <li key={t}>{t}</li>)}
                                    </ul>
                                </div>
                                <div style={{ padding: '20px', borderRadius: '16px', background: 'rgba(251, 191, 36, 0.06)', border: '1px solid rgba(251, 191, 36, 0.25)' }}>
                                    <div style={{ fontSize: '12px', fontWeight: '600', color: C.amber, letterSpacing: '0.3px', marginBottom: '12px' }}>≈ MODELED (ASSUMED)</div>
                                    <ul style={{ paddingLeft: '18px', fontSize: '13px', color: C.sub, lineHeight: 1.5, display: 'grid', gap: '10px' }}>
                                        {ASSUMPTIONS.modeled.map(([what, why]) => (
                                            <li key={what}>
                                                <span style={{ color: '#fff' }}>{what}</span><br />
                                                <span style={{ fontSize: '12px', color: C.muted }}>{why}</span>
                                            </li>
                                        ))}
                                    </ul>
                                </div>
                                <div style={{ padding: '20px', borderRadius: '16px', background: 'rgba(248, 113, 113, 0.06)', border: '1px solid rgba(248, 113, 113, 0.25)' }}>
                                    <div style={{ fontSize: '12px', fontWeight: '600', color: C.red, letterSpacing: '0.3px', marginBottom: '12px' }}>? UNKNOWN UNTIL ENROLLMENT</div>
                                    <ul style={{ paddingLeft: '18px', fontSize: '13px', color: C.sub, lineHeight: 1.6, display: 'grid', gap: '6px' }}>
                                        {ASSUMPTIONS.unknown.map((t) => <li key={t}>{t}</li>)}
                                    </ul>
                                    <p style={{ fontSize: '12px', color: C.muted, marginTop: '14px', lineHeight: 1.5 }}>
                                        PSE's public pages don't answer these, and PSE may change incentives at any time. A facility assessment with PSE would settle them for a real site.
                                    </p>
                                </div>
                            </div>
                        </section>

                        <footer style={{ marginTop: '40px', textAlign: 'center', paddingTop: '24px', borderTop: '1px solid rgba(255,255,255,0.06)' }}>
                            <p style={{ fontSize: '13px', color: '#4a6382', marginBottom: '6px' }}>
                                Built by Nora • Demonstrating product thinking for PSE's Product Development Manager, C&I Demand Response role
                            </p>
                            <p style={{ fontSize: '11px', color: '#4a6382', marginBottom: '6px', lineHeight: 1.5 }}>
                                Program terms, peak data, and Schedule 26 rates come from the PSE and state sources below, checked October 2026; PSE may change incentives at any time. Load shapes, controls costs, and emissions factors are illustrative.
                            </p>
                            <p style={{ fontSize: '11px', lineHeight: 1.8 }}>
                                {SOURCES.map(([label, url], i) => (
                                    <span key={url}>
                                        {i > 0 && <span style={{ color: '#4a6382' }}> · </span>}
                                        <a href={url} target="_blank" rel="noopener noreferrer" style={{ color: '#6b8299' }}>{label}</a>
                                    </span>
                                ))}
                            </p>
                        </footer>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<CIDemandResponseSimulator />);
    </script>
</body>
</html>
